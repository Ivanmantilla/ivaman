<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoilQuiz – multiple choice</title>
<style>
  :root{--bg:#f6f1e7;--card:#fffdf8;--ink:#2b2118;--muted:#7a6a58;--brown:#6b4423;--green:#4f7a3a;--gold:#e0a21b;--line:#e3d8c3;--red:#b5402a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
  header{background:linear-gradient(180deg,#2b2118 0 34%,#6b4423 34% 68%,#d9b04a 68%);padding:28px 20px 22px;color:#fff;text-align:center;position:relative}
  header h1{margin:0;font-size:2rem;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  header p{margin:4px 0 0;text-shadow:0 1px 4px rgba(0,0,0,.6)}
  .lang{position:absolute;right:14px;top:12px}
  .lang button{border:1px solid rgba(255,255,255,.6);background:rgba(0,0,0,.25);border-radius:8px;padding:2px 10px;cursor:pointer;color:#fff}
  .lang button.on{background:#fff;color:var(--brown)}
  main{max-width:860px;margin:0 auto;padding:16px}
  .prog{height:8px;background:#e8dcc6;border-radius:4px;overflow:hidden;margin:4px 0 6px}
  .prog i{display:block;height:100%;background:var(--green);width:0;transition:width .35s}
  .steps{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-bottom:12px}
  .steps b{color:var(--brown)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
  h2{margin:0 0 8px;font-size:1.2rem;color:var(--brown)}
  p.s{color:var(--muted);margin:4px 0 12px;font-size:.93rem}
  .who{padding:12px 18px}.who label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:4px}.who input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
  .qhead{display:flex;gap:14px;align-items:flex-start}
  .qhead img{width:120px;height:120px;object-fit:cover;border-radius:10px;border:1px solid var(--line);flex:none;background:#eee}
  .qhead.wide img{width:210px;height:118px}
  .stage{position:relative;border-radius:10px;overflow:hidden;line-height:0;margin-top:6px;background:#eee}
  .stage img{width:100%;height:auto;display:block}
  /* number badges sit BELOW the figures, on the empty table area */
  .pin{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;border:2px solid #fff;background:var(--brown);color:#fff;font-weight:700;font-size:1rem;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.45);transition:transform .12s;padding:0}
  .pin{display:flex;align-items:center;justify-content:center}
  .pin:hover,.pin.act{transform:translate(-50%,-50%) scale(1.2);background:var(--gold);color:#2b2118}
  .pin.done{background:var(--green)}
  .pin.act.done{background:var(--gold)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:14px}
  .m{border:2px solid var(--line);border-radius:12px;padding:8px;background:#fff;transition:border-color .15s}
  .m.act{border-color:var(--gold);box-shadow:0 0 0 3px rgba(224,162,27,.25)}
  .m .ph{position:relative;cursor:zoom-in;border-radius:8px;overflow:hidden;background:#eee;aspect-ratio:1/1}
  .m .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .m .ph span{position:absolute;left:6px;top:6px;background:var(--brown);color:#fff;border-radius:50%;width:28px;height:28px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
  .m select.mc{width:100%;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
  .m input[type=text]{width:100%;margin-top:8px;padding:9px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
  .m input[type=text]:focus,.other input:focus{outline:2px solid var(--green);border-color:var(--green)}
  .m .hl{margin-top:8px;color:var(--green);font-weight:600;font-size:.95rem}
  .m .fb{font-size:.8rem;margin-top:3px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;font:inherit;transition:all .12s}
  .chip:hover{border-color:var(--green)}
  .chip.on{background:var(--green);border-color:var(--green);color:#fff}
  .chip.dis{opacity:.4;cursor:not-allowed}
  .other{margin-top:14px}
  .other label{font-size:.9rem;color:var(--muted);display:block;margin-bottom:4px}
  .other input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit}
  .cnt{margin-top:8px;color:var(--muted);font-size:.9rem}
  .num{display:flex;align-items:center;gap:10px;margin:12px 0 6px}
  .num input[type=number]{width:190px;padding:12px;font-size:1.3rem;border:2px solid var(--line);border-radius:10px;font-family:inherit}
  .num .u{font-size:1.1rem;color:var(--muted)}
  input[type=range]{width:100%;accent-color:var(--green)}
  .hint{font-size:.85rem;color:var(--muted)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
  .btn{padding:12px 20px;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;background:var(--green);color:#fff}
  .btn.sec{background:#e8dcc6;color:var(--brown)}
  .btn:disabled{background:#b8c4ad;cursor:not-allowed}
  .stars{display:flex;gap:6px;justify-content:center;margin:8px 0}
  .stars button{font-size:2.4rem;line-height:1;background:none;border:none;cursor:pointer;color:#d8ccb6;padding:2px;transition:transform .1s}
  .stars button.on{color:var(--gold)} .stars button:hover{transform:scale(1.15)}
  textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;resize:vertical;background:#fff}
  .msg{text-align:center;color:var(--muted);font-size:.9rem;margin-top:8px;min-height:1.2em}
  .row{display:flex;align-items:center;gap:10px;margin:5px 0;font-size:.92rem}
  .row .lab{width:170px;flex:none}
  .row .bar{flex:1;height:14px;background:#efe6d3;border-radius:7px;overflow:hidden}
  .row .bar i{display:block;height:100%;background:var(--green);width:0;transition:width .5s}
  .row .n{width:40px;text-align:right;color:var(--muted)}
  .big{font-size:2.2rem;font-weight:700;color:var(--brown);line-height:1.1}
  .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
  .stat .sub{font-size:.8rem;color:var(--muted)}
  .rm{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:.92rem}
  .rm img{width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid var(--line);flex:none}
  .c{border-top:1px solid var(--line);padding:8px 0;font-size:.92rem} .c b{color:var(--gold)}
  .hide{display:none}
  .mchips{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
  .mchip{position:relative;border:3px solid var(--line);background:#fff;border-radius:12px;padding:0;cursor:pointer;overflow:hidden;aspect-ratio:1/1;transition:all .12s}
  .mchip img{width:100%;height:100%;object-fit:cover;display:block}
  .mchip b{position:absolute;left:6px;top:6px;background:var(--brown);color:#fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
  .mchip:hover{border-color:var(--green)}
  .mchip.on{border-color:var(--green);box-shadow:0 0 0 4px rgba(79,122,58,.35)}.mchip.on b{background:var(--green)}
  .mchip.on::after{content:"✔";position:absolute;right:8px;bottom:6px;font-size:1.6rem;color:#fff;text-shadow:0 0 4px #000,0 0 4px #000}
  .mchip.dis{opacity:.4;cursor:not-allowed}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:10px 0 4px}
  .opt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:14px 8px;font:inherit;font-size:1.15rem;font-weight:600;cursor:pointer;transition:all .12s}
  .opt:hover{border-color:var(--green)}.opt.on{background:var(--green);border-color:var(--green);color:#fff}
  .lbl{display:block;font-weight:600;color:var(--brown);margin-top:14px}
  .rk{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;margin:4px 0;background:#fff;border:1px solid var(--line)}
  .rk.me{border-color:var(--gold);background:#fff8e1;font-weight:600}
  .rk .pos{width:34px;text-align:center;font-size:1.2rem;color:var(--brown);font-weight:700}
  .rk .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rk .pt{font-variant-numeric:tabular-nums;color:var(--muted)}
  .rk .ps{width:22px;text-align:center;font-weight:700}.rk .ps.p{color:#237841}.rk .ps.f{color:#b5402a}
  .verdict{display:flex;align-items:center;gap:18px;justify-content:center;text-align:left;border-width:3px}
  .verdict.pass{border-color:#237841;background:#eaf6ec}.verdict.fail{border-color:#b5402a;background:#fbeeea}
  .verdict .vt{font-size:1.9rem;font-weight:800}.verdict.pass .vt{color:#237841}.verdict.fail .vt{color:#b5402a}
  .verdict .vs{color:var(--muted);font-size:1rem;margin-top:2px}
  .verdict.pass #vface svg{animation:hop .9s ease-in-out 3}.verdict.fail #vface svg{animation:droop 1.6s ease-in-out 1 forwards;transform-origin:50% 100%}
  @keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px) rotate(-4deg)}70%{transform:translateY(0) rotate(3deg)}}
  @keyframes droop{to{transform:rotate(-7deg) translateY(4px)}}
  .brick{position:fixed;top:-30px;width:18px;height:12px;border-radius:2px;z-index:40;pointer-events:none;animation:fall 3s linear forwards;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
  #lb{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}
  #lb img{max-width:92vw;max-height:88vh;border-radius:10px;background:#fff}
  @media(max-width:560px){.two,.three{grid-template-columns:1fr}.row .lab{width:105px}.pin{width:26px;height:26px;font-size:.8rem;border-width:1px}.qhead img{width:84px;height:84px}.qhead.wide img{width:120px;height:68px}}
</style>
</head>
<body>
<header>
  <div class="lang"><button id="l-en" class="on">EN</button> <button id="l-no">NO</button></div>
  <h1>SoilQuiz</h1>
  <p data-t="tag">Soil health in 4 questions · NIBIO</p>
</header>
<main>
  <div class="card who"><label for="who" data-t="whol"></label><input type="text" id="who" maxlength="120" autocomplete="name" data-ph="whop"></div>
  <div class="prog"><i id="pbar"></i></div>
  <div class="steps" id="steps"></div>

  <!-- Q1 -->
  <section class="card step" data-step="0">
    <h2 data-t="q1h"></h2>
    <p class="s" data-t="q1p"></p>
    <div class="stage" id="stage"><img id="g1" alt="LEGO soil models 1–8"></div>
    <div class="grid" id="mgrid"></div>
    <div class="cnt" id="q1cnt"></div>
  </section>

  <!-- Q2 -->
  <section class="card step hide" data-step="1">
    <h2 data-t="q2h"></h2><p class="s" data-t="q2p"></p>
    <div class="stage" id="stage2"><img id="hq2" alt="LEGO soil models 1–8"></div>
    <div class="mchips" id="q2chips"></div>
    <div class="cnt" id="q2cnt"></div>
  </section>

  <!-- Q3 -->
  <section class="card step hide" data-step="2">
    <div class="qhead"><img id="hq3" alt=""><div><h2 data-t="q3h"></h2><p class="s" data-t="q3p"></p></div></div>
    <div class="opts" id="q3opts"></div><div class="hint" data-t="q3u"></div>
  </section>

  <!-- Q4 -->
  <section class="card step hide" data-step="3">
    <div class="qhead"><img id="hq4" alt=""><div><h2 data-t="q4h"></h2><p class="s" data-t="q4p"></p></div></div>
    <label class="lbl" data-t="q4a"></label>
    <div class="opts" id="q4opts"></div>
    <label class="lbl" data-t="q4b"></label>
    <div class="opts" id="q4gopts"></div><div class="hint" data-t="q4u"></div>
  </section>

  <!-- Vote -->
  <section class="card step hide" data-step="4">
    <h2 data-t="vh"></h2>
    <p class="s" data-t="vp"></p>
    <div class="stars" id="stars"></div>
    <textarea id="comment" maxlength="300" data-ph="cph"></textarea>
    <div class="msg" id="msg"></div>
  </section>

  <!-- Results -->
  <section class="step hide" data-step="5">
    <div class="card hide" id="savewarn" style="background:#fff8e1;border-color:#e0a21b"><span data-t="warn"></span></div>
    <div class="card verdict hide" id="verdict"><div id="vface"></div><div><div class="vt" id="vtitle"></div><div class="vs" id="vsub"></div></div></div>
    <div class="card">
      <h2 data-t="rh"></h2>
      <div class="two">
        <div class="stat"><div class="big" id="avg">–</div><div class="sub"><span id="count">0</span> <span data-t="votes"></span> · <span data-t="avgl"></span></div></div>
        <div class="stat" id="scorebox"><div class="big" id="score">–</div><div class="sub" data-t="scorel"></div></div>
      </div>
    </div>
    <div class="card"><h2 data-t="r1"></h2><div id="r1"></div></div>
    <div class="card"><h2 data-t="r2"></h2><div id="r2"></div></div>
    <div class="card"><h2 data-t="r3"></h2>
      <div class="sub" data-t="q3s"></div><div id="d3"></div>
      <div class="sub" style="margin-top:12px" data-t="q4s"></div><div id="d4"></div>
      <div class="sub" style="margin-top:12px" data-t="q4gs"></div><div id="d4g"></div>
    
    <div class="card hide" id="ccard"><h2 data-t="ch"></h2><div id="clist"></div></div>
    <div class="card hide" id="rcard"><h2 data-t="rk"></h2><div id="rank"></div></div>
    <div class="nav"><button class="btn sec" id="redo" data-t="redo"></button></div>
  </section>

  <div class="nav" id="nav">
    <button class="btn sec" id="back" data-t="back"></button>
    <button class="btn" id="next" data-t="next"></button>
  </div>
</main>
<div id="lb"><img alt=""></div>

/* map free text to a threat key if it matches a label, otherwise keep lower-cased text */
function canon(s){
  const x=String(s||"").trim().toLowerCase();if(!x)return"";
  const t=ALL.find(t=>t[0]===x||t[1].toLowerCase()===x||t[2].toLowerCase()===x);
  if(t)return t[0];
  if(/^[1-8]$/.test(x)&&ANSWERS.models[x])return ANSWERS.models[x];
  for(const [k,al] of Object.entries(ALIASES))if(al.some(a=>x===a||(a.length>=5&&x.includes(a))))return k;
  return x;
}

const f1=n=>(n==null||isNaN(n))?"–":(Math.round(n*10)/10).toLocaleString(lang==="en"?"en-GB":"nb-NO");
function bindNum(nid,rid,key,minLog,maxLog){
  const n=$(nid),r=$(rid),h=$(nid.replace(/n$/,"h2"));
  const hint=()=>{const v=A[key];h.textContent=!v?"":(key==="q3"?`≈ ${f1(v*25)} ${T[lang].tonnes}`:`≈ ${f1(v*7)} ${T[lang].dec} ≈ ${f1(v*0.7)} ha`)};
  n.oninput=()=>{const v=parseFloat(n.value);A[key]=v>=0?v:null;if(v>0)r.value=Math.min(maxLog,Math.max(minLog,Math.log10(v)));hint();validate()};
  r.oninput=()=>{A[key]=Math.max(1,Math.round(Math.pow(10,parseFloat(r.value))));n.value=A[key];hint();validate()};
}
/* ---------- navigation ---------- */
function validate(){
  let ok=true;
  if(step===0)ok=MODELS.every(m=>A.m[m.n]);
  if(step===1)ok=q2items().length>=1;
  if(step===2)ok=A.q3!=null&&A.q3>0;
  if(step===3)ok=A.q4>0&&A.q4g>0;

}
function show(s){

  $("back").style.visibility=(s===0)?"hidden":"visible";

}
$("back").onclick=()=>show(step-1);

/* ---------- data ---------- */
function docsOf(snap){
  const arr=snap&&(snap.docs||snap);if(!arr||!arr.forEach)return[];
  const out=[];arr.forEach(d=>{const x=typeof d.data==="function"?d.data():(d.data||d);if(x&&typeof x.rating==="number")out.push({...x,_id:d.id})});return out;
}
async function submit(){
  $("next").disabled=true;
  const m={};Object.entries(A.m).forEach(([k,v])=>m[k]=v);
  const rec={rating,comment:$("comment").value.trim().slice(0,300),ts:Date.now(),who:A.who.trim().slice(0,120),answers:{m,q2:q2items().slice(0,4),q3:A.q3,q4:A.q4,q4g:A.q4g}};
  let saved=true;
  try{if(!db||!myId)throw new Error("no store");await db.doc("votes/"+myId).set(rec)}catch(e){saved=false}
  if(saved)submitted=true;
  else{ // still show the person's own score, even if sharing the answers failed
    const me=myId||"me";votes=[...votes.filter(v=>v._id!==me),{...rec,_id:me}];if(!myId)myId=me;
  }
  $("savewarn").classList.toggle("hide",saved);
  show(5);
  $("next").disabled=false;
}
function median(a){a=a.filter(x=>typeof x==="number"&&x>=0).sort((x,y)=>x-y);if(!a.length)return null;const m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2}
const label=k=>ALL.some(t=>t[0]===k)?tn(k):k;

const near=(a,k)=>a!=null&&k>0&&Math.abs(a-k)/k<=TOL;
function scoreAns(m,q2,q3,q4,q4g){
  if(!hasKey())return null;
  let got=0,max=0;m=m||{};
  Object.entries(ANSWERS.models).forEach(([k,v])=>{max++;if(canon(m[k])===canon(v))got++});
  if(ANSWERS.q2.length){const key=[...new Set(ANSWERS.q2.map(canon))];max+=key.length;[...new Set((q2||[]).slice(0,4).map(canon))].forEach(x=>{if(key.includes(x))got++})}
  if(ANSWERS.q3!=null){max++;if(near(q3,ANSWERS.q3))got++}
  if(ANSWERS.q4!=null){max++;if(near(q4,ANSWERS.q4))got++}
  if(ANSWERS.q4g!=null){max++;if(near(q4g,ANSWERS.q4g))got++}
  return[got,max];
}
const myScore=()=>scoreAns(A.m,q2items(),A.q3,A.q4,A.q4g);
function shownName(w){
  w=String(w||"").trim();if(!w)return T[lang].anon;
  const m=w.match(/^([^@\s]{1,})@(.+)$/);           // hide most of an email address
  return m?m[1][0]+"***@"+m[2]:w;
}
function renderRanking(){
  const box=$("rank");
  if(!hasKey()){$("rcard").classList.add("hide");return}
  $("rcard").classList.remove("hide");
  const rows=votes.filter(v=>v.answers).map(v=>{const sc=scoreAns(v.answers.m,v.answers.q2,v.answers.q3,v.answers.q4,v.answers.q4g);return{id:v._id,who:v.who,got:sc[0],max:sc[1],ts:v.ts||0}})
    .sort((a,b)=>b.got-a.got||a.ts-b.ts);
  if(!rows.length){box.innerHTML=`<div class="hint">${T[lang].noData}</div>`;return}
  const medal=["🥇","🥈","🥉"];
  box.innerHTML=rows.slice(0,15).map((r,i)=>`<div class="rk ${r.id===myId?"me":""}"><span class="pos">${medal[i]||i+1}</span><span class="nm">${esc(shownName(r.who))}${r.id===myId?" ("+T[lang].you+")":""}</span><span class="pt">${r.got}/${r.max}</span><span class="ps ${r.got>=PASS_MARK?"p":"f"}">${r.got>=PASS_MARK?"✔":"✘"}</span></div>`).join("")
    +(rows.length>15?`<div class="hint">… ${rows.length-15} more</div>`:"");
  const me=rows.findIndex(r=>r.id===myId);
  if(me>=15)box.insertAdjacentHTML("beforeend",`<div class="rk me"><span class="pos">${me+1}</span><span class="nm">${T[lang].you}</span><span class="pt">${rows[me].got}/${rows[me].max}</span><span class="ps"></span></div>`);
}
function faceSVG(happy){
  const mouth=happy?'<path d="M34 66 Q50 84 66 66" fill="none" stroke="#2b2118" stroke-width="5" stroke-linecap="round"/>':'<path d="M34 78 Q50 60 66 78" fill="none" stroke="#2b2118" stroke-width="5" stroke-linecap="round"/>';
  const brows=happy?'':'<path d="M28 34 L42 40 M72 34 L58 40" stroke="#2b2118" stroke-width="4" stroke-linecap="round"/>';
  const tear=happy?'':'<path d="M68 56 q-5 10 0 14 q5 -4 0 -14z" fill="#5aa9e6"/>';
  return `<svg viewBox="0 0 100 110" width="130" height="143" role="img" aria-label="${happy?"happy":"sad"} brick face"><rect x="38" y="4" width="24" height="14" rx="4" fill="#e6b800" stroke="#b58f00" stroke-width="2"/><rect x="12" y="14" width="76" height="86" rx="14" fill="#ffd400" stroke="#b58f00" stroke-width="3"/><circle cx="35" cy="48" r="6" fill="#2b2118"/><circle cx="65" cy="48" r="6" fill="#2b2118"/>${brows}${mouth}${tear}</svg>`;
}
function renderVerdict(){
  const sc=myScore(),box=$("verdict");
  if(!sc){box.classList.add("hide");return}
  box.classList.remove("hide");
  const pass=sc[0]>=PASS_MARK;
  box.className="card verdict "+(pass?"pass":"fail");
  $("vface").innerHTML=faceSVG(pass);
  $("vtitle").textContent=pass?T[lang].passT:T[lang].failT;
  $("vsub").textContent=T[lang].vsub(sc[0],sc[1],PASS_MARK);
  document.querySelectorAll(".brick").forEach(e=>e.remove());
  if(pass){const cols=["#d01012","#0055bf","#ffd400","#237841","#fe8a18"];
    for(let i=0;i<26;i++){const b=document.createElement("div");b.className="brick";b.style.left=Math.random()*100+"vw";b.style.background=cols[i%5];b.style.animationDelay=(Math.random()*1.2)+"s";b.style.animationDuration=(2.2+Math.random()*1.6)+"s";document.body.appendChild(b);setTimeout(()=>b.remove(),5500)}}
}
function renderResults(){
  const n=votes.length,rs=votes.filter(v=>v.rating>0);
  $("count").textContent=n;
  $("avg").textContent=rs.length?(rs.reduce((a,v)=>a+v.rating,0)/rs.length).toFixed(1)+" ★":"–";

  const sc=myScore();$("score").textContent=sc?T[lang].scoreOf(sc[0],sc[1]):"";$("scorebox").classList.toggle("hide",!sc);
  const r1=$("r1");r1.innerHTML="";
  MODELS.forEach(m=>{
    const cnt={},raw={};let tot=0;
    votes.forEach(v=>{const t=v.answers&&v.answers.m&&v.answers.m[m.n];const k=canon(t);if(k){cnt[k]=(cnt[k]||0)+1;raw[k]=raw[k]||String(t).trim();tot++}});
    const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
    const mine=A.m[m.n];const key=ANSWERS.models[m.n];
    let fb="";if(key&&SHOW_ANSWERS)fb=canon(mine)===canon(key)?` <span style="color:var(--green)">${T[lang].ok}</span>`:` <span style="color:var(--red)">${T[lang].bad}${esc(label(canon(key)))}</span>`;
    r1.insertAdjacentHTML("beforeend",`<div class="rm"><img src="${IMG["m"+m.n]}" alt=""><div><b>${m.n}.</b> ${top?`${esc(ALL.some(t=>t[0]===top[0])?tn(top[0]):raw[top[0]])} <span class="hint">(${Math.round(top[1]/tot*100)}% · ${T[lang].top})</span>`:T[lang].noData}<div class="hint">${mine?esc(label(canon(mine))):""}${fb}</div></div></div>`);
  });
  const c2={},raw2={};
  votes.forEach(v=>(v.answers&&v.answers.q2||[]).forEach(t=>{const k=canon(t);if(k){c2[k]=(c2[k]||0)+1;raw2[k]=raw2[k]||String(t)}}));
  const keys=Object.keys(c2).sort((a,b)=>c2[b]-c2[a]);if(!keys.length)$("r2").innerHTML=T[lang].noData;
  const mx=Math.max(1,...Object.values(c2));const mine2=q2items().map(canon);const keyset=ANSWERS.q2.map(canon);
  if(keys.length)$("r2").innerHTML=keys.map(k=>{const c=c2[k]||0;return `<div class="row"><span class="lab">${mine2.includes(k)?"● ":""}${esc(ALL.some(t=>t[0]===k)?tn(k):(raw2[k]||k))}${SHOW_ANSWERS&&keyset.includes(k)?" ✔":""}</span><div class="bar"><i style="width:${c/mx*100}%"></i></div><span class="n">${c}</span></div>`}).join("");
  [["q3","d3"],["q4","d4"],["q4g","d4g"]].forEach(([k,id])=>{
    const cnt=OPTS[k].map(o=>votes.filter(v=>v.answers&&v.answers[k]===o).length),mx=Math.max(1,...cnt);
    $(id).innerHTML=OPTS[k].map((o,i)=>`<div class="row"><span class="lab" style="width:90px">${A[k]===o?"● ":""}${fmt(o)}</span><div class="bar"><i style="width:${cnt[i]/mx*100}%"></i></div><span class="n">${cnt[i]}</span></div>`).join("");
  });
  const cm=votes.filter(v=>v.comment&&v.comment.trim()).sort((a,b)=>(b.ts||0)-(a.ts||0));

$("l-no").onclick=()=>{lang="no";applyLang()};

function loadMine(){
  const mine=votes.find(v=>v._id===myId);
  if(mine&&!submitted&&mine.answers){
    submitted=true;rating=mine.rating;$("comment").value=mine.comment||"";
    const q=mine.answers.q2||[];$("who").value=A.who=mine.who||"";
    Object.assign(A,{m:mine.answers.m||{},q2n:q.map(Number).filter(n=>n>=1&&n<=8),q3:mine.answers.q3??null,q4:mine.answers.q4??null,q4g:mine.answers.q4g??null});

  drawStars();applyLang();

    myId="me";
    const refresh=async()=>{
      const r=await fetch(ENDPOINT+(ENDPOINT.includes("?")?"&":"?")+"id="+encodeURIComponent(cid)+"&t="+Date.now());
      const j=await r.json();votes=(j.votes||[]).filter(v=>v&&v.answers&&typeof v.rating==="number");loadMine();if(step===5)renderResults();
    };
    db={doc:()=>({set:async v=>{
      const r=await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({id:cid,who:v.who,rating:v.rating,comment:v.comment,answers:v.answers})});
      const j=await r.json();if(!j.ok)throw new Error("save failed");await refresh();
    }})};
    try{await refresh()}catch(e){$("msg").textContent=T[lang].offline}
    setInterval(()=>{if(step===5)refresh().catch(()=>{})},15000);
    return;
  }
  if(typeof claude==="undefined"){
    const K="soilquiz-votes-mc";
    const load=()=>{try{return JSON.parse(localStorage.getItem(K)||"[]")}catch(e){return[]}};
    votes=load();myId="me";loadMine();
    $("msg").textContent=T[lang].standalone;
    db={doc:()=>({set:async v=>{const a=load().filter(x=>x._id!=="me");a.push({...v,_id:"me"});try{localStorage.setItem(K,JSON.stringify(a))}catch(e){}votes=a}})};
    return;
  }
  try{
    const user=await claude.use("user");db=await claude.use("db");
    if(!db||!user){$("msg").textContent=T[lang].signin;return}
    myId=await user.id();
    db.collection("votes").onSnapshot(snap=>{votes=docsOf(snap);loadMine();if(step===5)renderResults()});
  }catch(e){$("msg").textContent=T[lang].signin}
}
init();
</script>
</body>
</html>
